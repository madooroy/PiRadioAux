# PiRadio (direct output): the audio device is used as it is, with no
# software mixer. Used for the Pi's built-in headphone jack, which already
# lets several programs play at once, and as a fallback for other devices.
# @CARD@ is filled in by install.sh with the device's name from `aplay -l`.

pcm.!default {
    type plug
    slave.pcm "hw:CARD=@CARD@"
}

ctl.!default {
    type hw
    card "@CARD@"
}
