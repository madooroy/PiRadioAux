# PiRadioAux: minimal MPD setup for internet radio only.
music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
user                "mpd"
bind_to_address     "localhost"
port                "6600"
auto_update         "no"
restore_paused      "yes"

input {
    plugin "curl"
}

audio_output {
    type        "alsa"
    name        "PiRadio"
    device      "default"
    mixer_type  "software"
}
