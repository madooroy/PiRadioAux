# PiRadio (shared output): a software mixer, so the radio player (MPD) and Spotify
# (Raspotify) can both use the audio adapter without fighting over it.
# @CARD@ is filled in by install.sh with the adapter's name from `aplay -l`.

pcm.!default {
    type plug
    slave.pcm "piradio_mix"
}

pcm.piradio_mix {
    type dmix
    ipc_key 20261008
    ipc_perm 0666
    slave {
        pcm "hw:CARD=@CARD@"
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

ctl.!default {
    type hw
    card "@CARD@"
}
